<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 04 - Input Color RGBA - JS DOM FreeCodeCamp </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="freecodecamp_logo_icon_248501.ico" image/x-icon">
</head>

<body>

    <div class="contenedor-principal">

        <div class="contenedor-interno">

            <div class="color">
                <label for="rojo" class="labelRojo"> Rojo (R) </label>
                <div>
                    <button id="btnDecrementoRojo" class="btnRojo"> - </button>
                    <input id="rojo" type="range" min="0" max="255" value="23" step="1">
                    <button id="btnIncrementoRojo" class="btnRojo"> + </button>
                </div>
                <p id="texto-rojo"> </p>
            </div>

            <div class="color">
                <label for="verde" class="labelVerde"> Verde (G) </label>
                <div>
                    <button id="btnDecrementoVerde" class="btnVerde"> - </button>
                    <input id="verde" type="range" min="0" max="255" value="41" step="1">
                    <button id="btnIncrementoVerde" class="btnVerde"> + </button>
                </div>

                <p id="texto-verde"> </p>
            </div>

            <div class="color">
                <label for="azul" class="labelAzul"> Azul (B) </label>
                <div>
                    <button id="btnDecrementoAzul" class="btnAzul"> - </button>
                    <input id="azul" type="range" min="0" max="255" value="56" step="1">
                    <button id="btnIncrementoAzul" class="btnAzul"> + </button>
                </div>

                <p id="texto-azul"> </p>
            </div>

        </div>

    </div>

    <script src="app.js"> </script>
</body>

</html>
