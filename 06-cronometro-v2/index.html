<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 06 Mi Cronometro - JS DOM FreeCodeCamp </title>
    <link rel="icon" href="freecodecamp_logo_icon_248501.ico" image/x-icon">

    <!--  -----  Bootstrap Icon y Estilos  -----  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">

    <!--  -----  Fuente 'ds-digital'  -----  -->
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">

</head>

<body>

    <div class="contenedor-principal">

        <div class="contenedor-interno">

            <div class="contenedor-marcador-botones">

                <div id="marcador">
                    <div id="horasMarcador"> 00: </div>
                    <div id="minutosMarcador"> 00: </div>
                    <div id="segundosMarcador"> 00: </div>
                    <div id="centesimasMarcador"> 00 </div>
                </div>

                <div class="contenedor-botones">
                    <button id="boton-inicio-pausa" class="boton iniciar"> <i class="bi bi-play-fill"> </i> </button>
                    <button id="boton-reiniciar" class="boton"> <i class="bi bi-arrow-counterclockwise"> </i> </button>
                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
